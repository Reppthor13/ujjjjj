<!DOCTYPE html>
<html lang="hu">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Főoldal</title>
        <!--!Bootstrap-->
        <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css" />
        <!--?Popper: dropdowns, popovers, tooltips-->
        <script src="../bootstrap/js/popper.min.js"></script>
        <script src="../bootstrap/js/bootstrap.min.js"></script>
        <!--!CSS-->
        <link rel="stylesheet" href="../css/index.css" />
        <!--!JavaScript-->
        <script src="../javascript/index.js"></script>
    </head>
    <body>
        <div class="container-fluid">
            <div id="select">
                <button id="gomb">Szures</button>
            </div>
            <table>
                <thead>
                    <th>AR</th>
                    <th>NEV</th>
                    <th>BAB_SZARMAZASI_ORSZAG</th>
                    <th>BAB_GYARTASI_ORSZAG</th>
                </thead>
                <tbody id="tbody">

                </tbody>
            </table>
            <div class="container-fluid">
        </div>
        </div>
        <script>
            let jonev = "";
            Lekeres();
            function Lekeres() {
                fetch("http://127.0.0.1:4000/api/countries")
                    .then(x => x.json())
                    .then(Orszagok => {
                        const selectDiv = document.getElementById("select");
                        const select = document.createElement("select");
                        for (let i = 0; i < Orszagok.results.length; i++) {
                            const option = document.createElement("option");
                            option.value = Orszagok.results[i].nev;
                            option.textContent = Orszagok.results[i].nev;
                            select.append(option);
                        }
                        select.addEventListener("change", function () {
                            jonev = select.value;
                        });
                        jonev = select.value;
                        selectDiv.append(select);
                    });
            }
            document.getElementById("gomb").addEventListener("click", Kiiras);
            function Kiiras() {
                fetch("http://127.0.0.1:4000/api/osszes")
                    .then(x => x.json())
                    .then(Kavek => {
                        const tbody = document.getElementById("tbody");
                        tbody.textContent = "";
                        for (let i = 0; i < Kavek.results.length; i++) {
                            if (Kavek.results[i].szarmazas == jonev) {
                                const tr = document.createElement("tr");
                                const ar = document.createElement("td");
                                ar.textContent = Kavek.results[i].ar;
                                const nev = document.createElement("td");
                                nev.textContent = Kavek.results[i].nev;
                                const szarm = document.createElement("td");
                                szarm.textContent = Kavek.results[i].szarmazas;
                                const gyart = document.createElement("td");
                                gyart.textContent = Kavek.results[i].gyartas;
                                tr.append(ar, nev, szarm, gyart);
                                tbody.append(tr);
                            }
                        }
                    });
            }
        </script>
    </body>
</html>
